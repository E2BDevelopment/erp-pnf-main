<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vista móvil · ERP PNF</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e7e5e4;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: start center;
        padding: 16px;
      }
      .phone {
        width: 390px;
        height: 844px;
        border: 1px solid #a8a29e;
        border-radius: 28px;
        background: white;
        overflow: hidden;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.18);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="phone"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const route = params.get("route") || "/app/dashboard";
      const width = Number(params.get("w") || 390);
      const height = Number(params.get("h") || 844);
      const phone = document.querySelector(".phone");
      phone.style.width = width + "px";
      phone.style.height = height + "px";
      const frame = document.createElement("iframe");
      frame.id = "phone";
      frame.src = route;
      phone.appendChild(frame);
      window.__mobilePreview = { route, width, height, frame };
    </script>
  </body>
</html>
