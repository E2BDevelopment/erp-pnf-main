# Stack local de Supabase en Docker (Postgres, Auth, Storage, Studio y Mailpit).
# Referencia: https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` determina el nombre de los contenedores (supabase_*_<project_id>).
# Debe coincidir con SUPABASE_PROJECT_ID de `.env.local`.
project_id = "cxdcnvbjcwhvmkaalzzr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Misma versión mayor que el proyecto original en Supabase (Postgres 17).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# `supabase db reset` aplica las migraciones y luego este archivo.
# La empresa de demostración se siembra aparte con `npm run demo:seed`.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:3000",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
# En local no se exige confirmar el correo: los usuarios demo entran directo.
enable_confirmations = false

[analytics]
# Desactivado en local: el contenedor de logs (vector) no puede acceder al socket
# de Docker Desktop en Windows y queda en bucle de reinicio. No afecta a la app.
enabled = false
port = 54327
backend = "postgres"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:3000",
  "http://192.168.100.18:3000",
]